name: Release SDK

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.11"
      - name: Verify tag matches package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag must match the package version exactly.')
          PY
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install and run the built package
        run: |
          uv venv /tmp/sdk-release-check
          uv pip install --python /tmp/sdk-release-check/bin/python dist/*.whl
          cd /tmp
          /tmp/sdk-release-check/bin/python -c 'from moldable_gadget import GadgetClient'
          /tmp/sdk-release-check/bin/moldable-gadget --help
          /tmp/sdk-release-check/bin/python -m moldable_gadget --help
      - name: Record distribution hashes
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  pypi:
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/moldable-gadget-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Verify build artifacts
        run: |
          sha256sum --check dist/SHA256SUMS
          mkdir packages
          cp dist/*.whl dist/*.tar.gz packages/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/

  github:
    if: always() && needs.build.result == 'success' && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$RELEASE_TAG" in
            *a*|*b*|*rc*|*dev*) prerelease=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "Moldable Gadget SDK $RELEASE_TAG" --generate-notes "${prerelease[@]}"
